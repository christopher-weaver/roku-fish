name: Verify sideload ZIP

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-sideload-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the tracked ZIP matches the source
        run: python tools/check_release.py
      - name: Exercise missing, stale, and LFS-pointer rejection
        run: python -m unittest discover -s tests -p 'test_release_tracking.py' -v
      - name: Ensure rebuilding leaves the release unchanged
        run: git diff --exit-code -- dist/deep-reef-screensaver.zip dist/build-report.json
