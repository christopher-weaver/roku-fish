name: Verify sideload ZIP

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-sideload-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the tracked ZIP matches the source
        run: python tools/check_release.py
      - name: Exercise missing, stale, and LFS-pointer rejection
        run: python -m unittest discover -s tests -p 'test_release_tracking.py' -v
      - name: Ensure rebuilding leaves the release unchanged
        run: git diff --exit-code -- dist/deep-reef-screensaver.zip dist/build-report.json

  verify-native-motion:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install the pinned BrightScript tools
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Compile native sources
        run: npm run check
      - name: Check every fish with Roku shared-cursor semantics
        run: >-
          node tests/roku_runner.cjs --root roku
          roku/source/math.brs roku/source/camera.brs roku/source/settings-model.brs
          roku/source/aquarium.brs roku/source/fish.brs roku/source/schooling.brs
          roku/source/effects.brs tests/movement_regression.brs

      - name: Check swept coral collision and frame pacing
        run: >-
          node tests/roku_runner.cjs --root roku
          roku/source/math.brs roku/source/camera.brs roku/source/settings-model.brs
          roku/source/aquarium.brs roku/source/fish.brs roku/source/schooling.brs
          roku/source/effects.brs tests/reef_collision.brs
      - name: Check settings labels and remote navigation
        run: >-
          node tests/roku_runner.cjs --root roku
          roku/source/settings-model.brs roku/components/ReefSettings.brs tests/settings_ui.brs

      - name: Check synchronized waves and smooth frame timing
        run: >-
          node tests/roku_runner.cjs --root roku
          roku/source/math.brs roku/source/camera.brs roku/source/settings-model.brs
          roku/source/aquarium.brs roku/source/fish.brs roku/source/schooling.brs
          roku/source/effects.brs tests/waves_smoothness.brs

      - name: Check opaque canvas pan placement
        run: |
          node tests/roku_runner.cjs --root roku roku/source/math.brs roku/source/camera.brs tests/pan_precision.brs > /tmp/pan-check.txt
          python tools/pan_check.py /tmp/pan-check.txt

      - name: Check continuous fish turning
        run: >-
          node tests/roku_runner.cjs --root roku
          roku/source/math.brs roku/source/camera.brs roku/source/settings-model.brs
          roku/source/aquarium.brs roku/source/fish.brs roku/source/schooling.brs
          roku/source/effects.brs tests/turn_smoothness.brs

      - name: Check fish and formation draw ordering
        run: >-
          node tests/roku_runner.cjs --root roku
          roku/source/math.brs roku/source/camera.brs roku/source/settings-model.brs
          roku/source/aquarium.brs roku/source/fish.brs roku/source/schooling.brs
          roku/source/effects.brs roku/source/renderer.brs tests/render_depth.brs

      - name: Check upright fish and production pan calls
        run: >-
          node tests/roku_runner.cjs --root roku
          roku/source/math.brs roku/source/camera.brs roku/source/settings-model.brs
          roku/source/aquarium.brs roku/source/fish.brs roku/source/schooling.brs
          roku/source/effects.brs roku/source/renderer.brs tests/upright_present.brs

      - name: Check predictive fish traffic and animated marine rigs
        run: |
          node tests/roku_runner.cjs --root roku roku/source/math.brs roku/source/camera.brs roku/source/settings-model.brs roku/source/aquarium.brs roku/source/fish.brs roku/source/schooling.brs roku/source/effects.brs tests/fish_traffic.brs
          node tests/roku_runner.cjs --root roku roku/source/math.brs roku/source/camera.brs tests/marine_motion.brs

      - name: Check lateral fish behavior
        run: >-
          node tests/roku_runner.cjs --root roku
          roku/source/math.brs roku/source/camera.brs roku/source/settings-model.brs
          roku/source/aquarium.brs roku/source/fish.brs roku/source/schooling.brs
          roku/source/effects.brs tests/fish_profile.brs

      - name: Check projected surface lighting
        run: node tests/roku_runner.cjs --root roku roku/source/math.brs tests/surface_lighting.brs

      - name: Check cave reservation and swept fish entry
        run: >-
          node tests/roku_runner.cjs --root roku
          roku/source/math.brs roku/source/camera.brs roku/source/settings-model.brs
          roku/source/aquarium.brs roku/source/fish.brs roku/source/schooling.brs
          roku/source/effects.brs tests/cave_collision.brs

      - name: Check solid floor and reef footings
        run: >-
          node tests/roku_runner.cjs --root roku
          roku/source/math.brs roku/source/camera.brs roku/source/settings-model.brs
          roku/source/aquarium.brs roku/source/fish.brs roku/source/schooling.brs
          roku/source/effects.brs tests/floor_collision.brs
