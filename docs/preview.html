<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deep Reef · Aquarium preview</title>
<style>*{box-sizing:border-box}body{margin:0;background:#17151d;color:#f7e6e1;font:15px system-ui}main{max-width:1500px;margin:auto;padding:32px}header{display:flex;align-items:end;justify-content:space-between;margin-bottom:24px}h1{font:38px Georgia;margin:0 0 8px;letter-spacing:-1px}p{margin:0;color:#b9a9b7}.tag{font:11px system-ui;letter-spacing:3px;color:#e2ad99;margin-bottom:12px}canvas{width:100%;aspect-ratio:16/9;display:block;box-shadow:0 15px 70px #0008;border-radius:8px}nav{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:24px;padding:20px;background:#24212b;border:1px solid #40303c;border-radius:10px}button,select{font:inherit;background:#483342;color:#ffe7dd;border:1px solid #7c5367;padding:10px 18px;border-radius:6px}button{cursor:pointer}input{flex:1;min-width:180px;accent-color:#e09a8d}small{display:block;margin-top:18px;color:#aa9aaa}#error{color:#f0a18b}label{color:#bdaebb;font-size:12px;display:grid;gap:6px}a{color:#e9bba4}</style>
<main><header><div><div class="tag">A LITTLE WORLD. A SLOWER PACE.</div><h1>Deep Reef</h1><p>Pink light. Warm coral. Life beneath the surface.</p></div><p>Sunset collection</p></header>
<canvas id="tank" width="1920" height="1080" aria-label="Animated reef aquarium preview"></canvas><nav><button id="play">Pause</button><label>LIGHTING<select id="mode"><option>Sunset</option><option>Daylight</option><option>Dusk</option><option>Moonlight</option></select></label><input id="time" type="range" min="0" max="3" value="1.5" step=".01" aria-label="Simulation time"><output id="stamp">1.5 s</output><button id="full">Full screen</button></nav><small>Short production-world inspection recording · seed 47831 · <a href="../README.md">Build & installation guide</a></small><p id="error"></p></main>
<script type="module">
const canvas=document.querySelector('canvas'),c=canvas.getContext('2d'),slider=document.querySelector('#time'),stamp=document.querySelector('#stamp'),mode=document.querySelector('#mode'),play=document.querySelector('#play');
let frames,species,waveConfig,tank,assets={},playing=true,t=1.5,last=0;
try{
 [frames,species,waveConfig,tank]=await Promise.all([fetch('previews/frames.json').then(r=>r.json()),fetch('../roku/scenes/species.json').then(r=>r.json()),fetch('../roku/scenes/waves.json').then(r=>r.json()),fetch('../roku/scenes/tank.json').then(r=>r.json())]);
 const duration=frames.at(-1).time;slider.max=duration;
 const names=['water-day.webp','water-sunset.webp',...tank.formations.map(f=>f.image.split('/').pop()),'coral-shadow.png','mote.png','bubble.png','ray.png','surface-waves.png','sand-caustics.png',...Object.values(species).flatMap(sp=>[sp.image.split('/').pop(),sp.finImage.split('/').pop()])];
 await Promise.all(names.map(n=>new Promise((resolve,reject)=>{let im=new Image;im.onload=()=>{assets[n]=im;resolve()};im.onerror=()=>reject(new Error('Missing image '+n));im.src='../roku/images/'+n})));
 for(const name of tank.formations.map(f=>f.image.split('/').pop())){let source=assets[name],off=document.createElement('canvas');off.width=source.width;off.height=source.height;let ctx=off.getContext('2d');ctx.drawImage(source,0,0);let pixels=ctx.getImageData(0,0,off.width,off.height);for(let i=0;i<pixels.data.length;i+=4){pixels.data[i]*=221/255;pixels.data[i+1]*=235/255}ctx.putImageData(pixels,0,0);assets[name+'-cool']=off}
 const angle=(a,b,u)=>a+(((b-a+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI)*u;
 function frame(time){time=Math.max(0,Math.min(duration-.00001,time));let step=frames[1].time-frames[0].time,i=Math.min(frames.length-2,Math.floor(time/step)),a=frames[i],b=frames[i+1],u=Math.max(0,Math.min(1,(time-a.time)/(b.time-a.time))); return {time,displayTime:(a.displayTime??a.time)+((b.displayTime??b.time)-(a.displayTime??a.time))*u,camera:a.camera+(b.camera-a.camera)*u,effects:a.effects.map((e,j)=>{let g=b.effects[j];return {...e,x:Math.abs(e.x-g.x)<100?e.x+(g.x-e.x)*u:g.x,y:Math.abs(e.y-g.y)<100?e.y+(g.y-e.y)*u:g.y}}),fish:a.fish.map((f,j)=>{let g=b.fish[j],v={...f};for(let k of ['sx','sy','z','scale','pitch'])v[k]=f[k]+(g[k]-f[k])*u;v.heading=angle(f.heading,g.heading,u);v.phase=angle(f.phase,g.phase,u);v.finPhase=angle(f.finPhase,g.finPhase,u);return v})}}
 const draw=(n,x,y,sx=1,sy=sx,alpha=1)=>{if(alpha<=0)return;c.globalAlpha=alpha;let im=assets[n];c.drawImage(im,x,y,im.width*sx,im.height*sy);c.globalAlpha=1};
 function drawFish(f){const sp=species[f.name],pos=((f.heading%(2*Math.PI)+2*Math.PI)%(2*Math.PI))*sp.yawCount/(2*Math.PI),lo=Math.floor(pos),blend=pos-lo,width=sp.viewWidths[lo]*(1-blend)+sp.viewWidths[(lo+1)%sp.yawCount]*blend,s=f.scale*sp.length/sp.renderLength*f.size;
 c.save();c.translate(f.sx,f.sy);c.rotate(-f.pitch*(Math.cos(f.heading)<0?-1:1));c.filter=`brightness(${.82+.18*f.z})`;
 for(const part of ['body','fin']){const count=part==='body'?sp.poseCount:sp.finPoseCount,phase=part==='body'?f.phase:f.finPhase,position=(Math.sin(phase)+1)*.5*(count-1),first=Math.floor(position),fraction=position-first,second=Math.min(first+1,count-1),atlas=assets[(part==='body'?sp.image:sp.finImage).split('/').pop()],frames=part==='body'?sp.frames:sp.finFrames,denom=1-blend*fraction,weights=[1,fraction,denom>1e-8?blend*(1-fraction)/denom:0,blend*fraction];
 for(const [view,pose,opacity]of [[lo,first,weights[0]],[lo,second,weights[1]],[(lo+1)%sp.yawCount,first,weights[2]],[(lo+1)%sp.yawCount,second,weights[3]]]){if(opacity<=.001)continue;let fr=frames[view*count+pose];c.save();c.scale(width/sp.viewWidths[view],1);c.globalAlpha=opacity;const ts=part==='fin'?(sp.finTextureScale??1):1;c.drawImage(atlas,fr.x,fr.y,fr.w,fr.h,-fr.anchorX*s*ts,-fr.anchorY*s*ts,fr.w*s*ts,fr.h*s*ts);c.restore()}}
 c.restore()}

 function render(f){let displayTime=f.displayTime??f.time,warm=mode.value==='Sunset',suf=warm?'-sunset':'',day=mode.value==='Moonlight'?.12:mode.value==='Dusk'?.52:1;
 c.fillStyle='#182a42';c.fillRect(0,0,1920,1080);draw(warm?'water-sunset.webp':'water-day.webp',-f.camera,-36);
 let fs=[...f.fish].sort((a,b)=>a.z-b.z);
 const effects=(lo,hi)=>{for(let e of f.effects){if(e.z<lo||e.z>=hi)continue;if(e.bubble){if(e.active-48<6)draw('bubble.png',e.x-f.camera*(.6+e.z*.4),e.y,.42+e.z*.45,undefined,Math.min(1,Math.max(0,(e.y-38)/50))*150/255)}else if(e.active<24)draw('mote.png',e.x-f.camera*(.4+e.z*.6),e.y,.25+e.z*.4,undefined,105/255)}};
 for(const formation of tank.formations){const offset=64+(f.camera-64)*formation.parallax;draw('coral-shadow.png',formation.x+formation.width*.1-offset,formation.y+formation.height-60,formation.width*.8/128,.75)}
 let previousDepth=0,fishIndex=0;
 for(const formation of tank.formations){effects(previousDepth,formation.z);previousDepth=formation.z;
 while(fishIndex<fs.length&&fs[fishIndex].z<formation.z)drawFish(fs[fishIndex++]);
 const offset=64+(f.camera-64)*formation.parallax;
 const position=Math.max(0,Math.min(2,(f.camera-8)/56)),first=Math.floor(position),blend=position-first,atlas=assets[formation.image.split('/').pop()+(warm?'':'-cool')];
 for(const [view,opacity]of [[first,1],[Math.min(first+1,2),blend]]){if(opacity<=.001)continue;c.globalAlpha=opacity;c.drawImage(atlas,view*formation.frameWidth,0,formation.frameWidth,formation.frameHeight,formation.x-offset,formation.y-36,formation.width,formation.height)}c.globalAlpha=1}

 let wave=displayTime%waveConfig.period*waveConfig.frames/waveConfig.period,sg=waveConfig.sand;
 for(let j=0;j<2;j++){let i=(Math.floor(wave)+j)%waveConfig.frames;c.globalAlpha=(j?wave%1:1-wave%1)*225/255*day;c.drawImage(assets['sand-caustics.png'],(i%sg.columns)*sg.width,Math.floor(i/sg.columns)*sg.height,sg.width,sg.height,sg.x-f.camera,sg.y-36,sg.width*sg.scale,sg.height*sg.scale)}c.globalAlpha=1;
 fs.slice(fishIndex).forEach(drawFish);effects(previousDepth,1.01);for(let k=0;k<3;k++)draw('ray.png',150+k*590+Math.sin(displayTime*.07+k)*24-f.camera*.25,-70,2,1.8,(65+18*Math.sin(displayTime*.13+k))/255*day);
 let surf=assets['surface-waves.png'];for(let j=0;j<2;j++){let i=(Math.floor(wave)+j)%32;c.globalAlpha=(j?wave%1:1-wave%1)*(160+75*day)/255;for(let tile=0;tile<5;tile++)c.drawImage(surf,(i%8)*256,Math.floor(i/8)*128,256,128,-512+tile*512-f.camera,-8,512,128)}c.globalAlpha=1;
 if(day<1){c.fillStyle=`rgba(8,16,57,${(1-day)*150/255})`;c.fillRect(0,0,1920,1080)}if(warm||mode.value==='Dusk'){c.fillStyle=`rgba(241,105,108,${warm?38/255:20.9/255})`;c.fillRect(0,0,1920,1080)}}
 function tick(now){if(playing&&last)t=(t+Math.min(.1,(now-last)/1000))%duration;last=now;slider.value=t;stamp.value=t.toFixed(1)+' s';render(frame(t));requestAnimationFrame(tick)}requestAnimationFrame(tick);
 slider.oninput=()=>{t=+slider.value;playing=false;play.textContent='Play'};play.onclick=()=>{playing=!playing;play.textContent=playing?'Pause':'Play'};document.querySelector('#full').onclick=()=>canvas.requestFullscreen();window.reefPreview={seek(v){t=v;playing=false;play.textContent='Play'},inspect(){return {samples:frames.length,time:t,fish:frame(t).fish.map(f=>({id:f.id,x:f.sx,y:f.sy,phase:f.phase,finPhase:f.finPhase}))}},ready:true};
}catch(e){document.querySelector('#error').textContent=e.message+'. Serve the project with: python -m http.server 8000';console.error(e)}
</script></html>
