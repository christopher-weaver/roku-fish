<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deep Reef · Aquarium preview</title>
<style>*{box-sizing:border-box}body{margin:0;background:#17151d;color:#f7e6e1;font:15px system-ui}main{max-width:1500px;margin:auto;padding:32px}header{display:flex;align-items:end;justify-content:space-between;margin-bottom:24px}h1{font:38px Georgia;margin:0 0 8px;letter-spacing:-1px}p{margin:0;color:#b9a9b7}.tag{font:11px system-ui;letter-spacing:3px;color:#e2ad99;margin-bottom:12px}canvas{width:100%;aspect-ratio:16/9;display:block;box-shadow:0 15px 70px #0008;border-radius:8px}nav{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:24px;padding:20px;background:#24212b;border:1px solid #40303c;border-radius:10px}button,select{font:inherit;background:#483342;color:#ffe7dd;border:1px solid #7c5367;padding:10px 18px;border-radius:6px}button{cursor:pointer}input{flex:1;min-width:180px;accent-color:#e09a8d}small{display:block;margin-top:18px;color:#aa9aaa}#error{color:#f0a18b}label{color:#bdaebb;font-size:12px;display:grid;gap:6px}a{color:#e9bba4}</style>
<main><header><div><div class="tag">A LITTLE WORLD. A SLOWER PACE.</div><h1>Deep Reef</h1><p>Pink light. Warm coral. Life beneath the surface.</p></div><p>Sunset collection</p></header>
<canvas id="tank" width="1920" height="1080" aria-label="Animated reef aquarium preview"></canvas><nav><button id="play">Pause</button><label>LIGHTING<select id="mode"><option>Sunset</option><option>Daylight</option><option>Dusk</option><option>Moonlight</option></select></label><input id="time" type="range" min="0" max="59.99" value="20" step=".01" aria-label="Simulation time"><output id="stamp">20.0 s</output><button id="full">Full screen</button></nav><small>60-second inspection recording · seed 47831 · <a href="../README.md">Build & installation guide</a></small><p id="error"></p></main>
<script type="module">
const canvas=document.querySelector('canvas'),c=canvas.getContext('2d'),slider=document.querySelector('#time'),stamp=document.querySelector('#stamp'),mode=document.querySelector('#mode'),play=document.querySelector('#play');
let frames,species,assets={},playing=true,t=20,last=0;
try{
 [frames,species]=await Promise.all([fetch('previews/frames.json').then(r=>r.json()),fetch('../roku/scenes/species.json').then(r=>r.json())]);
 const names=['water-day.jpg','water-sunset.jpg','reef-mid.png','reef-front.png','reef-mid-sunset.png','reef-front-sunset.png','soft-coral.png','soft-coral-sunset.png','mote.png','bubble.png','ray.png',...Array.from({length:8},(_,i)=>`caustic-${i}.png`),...Object.keys(species).map(k=>k+'-atlas.png')];
 await Promise.all(names.map(n=>new Promise((resolve,reject)=>{let im=new Image;im.onload=()=>{assets[n]=im;resolve()};im.onerror=()=>reject(new Error('Missing image '+n));im.src='../roku/images/'+n})));
 const angle=(a,b,u)=>a+(((b-a+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI)*u;
 function frame(time){let i=Math.floor(time),u=time-i,a=frames[i],b=frames[i+1]||a;return {time,camera:a.camera+(b.camera-a.camera)*u,effects:a.effects,fish:a.fish.map((f,j)=>{let g=b.fish[j],v={...f};for(let k of ['sx','sy','z','scale','pitch'])v[k]=f[k]+(g[k]-f[k])*u;v.heading=angle(f.heading,g.heading,u);v.phase=angle(f.phase,g.phase,u);return v})}}
 const draw=(n,x,y,sx=1,sy=sx,alpha=1)=>{if(alpha<=0)return;c.globalAlpha=alpha;let im=assets[n];c.drawImage(im,x,y,im.width*sx,im.height*sy);c.globalAlpha=1};
 function drawFish(f){let sp=species[f.name],yaw=Math.round(((f.heading%(2*Math.PI)+2*Math.PI)%(2*Math.PI))*16/(2*Math.PI))%16,pose=Math.floor((Math.sin(f.phase)+1)*1.49),fr=sp.frames[yaw*3+pose],s=f.scale*sp.length/sp.renderLength*f.size;c.save();c.translate(f.sx,f.sy);c.rotate(-f.pitch*(Math.cos(f.heading)<0?-1:1));c.filter=`brightness(${.82+.18*f.z})`;c.drawImage(assets[f.name+'-atlas.png'],fr.x,fr.y,fr.w,fr.h,-fr.w*s/2,-fr.h*s/2,fr.w*s,fr.h*s);c.restore()}
 function render(f){let warm=mode.value==='Sunset',suf=warm?'-sunset':'',day=mode.value==='Moonlight'?.12:mode.value==='Dusk'?.52:1;
 c.fillStyle='#182a42';c.fillRect(0,0,1920,1080);draw(warm?'water-sunset.jpg':'water-day.jpg',-f.camera,-36);
 let phase=f.time*.8%8;for(let j=0;j<2;j++)for(let k=0;k<4;k++)draw(`caustic-${(Math.floor(phase)+j)%8}.png`,k*620-120-f.camera*.2+Math.sin(f.time*.06)*18,720,1.65,.9,(j?phase%1:1-phase%1)*82/255*day);
 let fs=[...f.fish].sort((a,b)=>a.z-b.z);
 const effects=(lo,hi)=>{for(let e of f.effects){if(e.z<lo||e.z>=hi)continue;if(e.bubble){if(e.active-48<6)draw('bubble.png',e.x-f.camera*(.6+e.z*.4),e.y,.24+e.z*.34,undefined,Math.min(1,Math.max(0,(e.y-38)/50))*150/255)}else if(e.active<24)draw('mote.png',e.x-f.camera*(.4+e.z*.6),e.y,.25+e.z*.4,undefined,105/255)}};
 effects(0,.48);fs.filter(v=>v.z<.48).forEach(drawFish);draw('reef-mid'+suf+'.png',-f.camera,124);fs.filter(v=>v.z>=.48&&v.z<.78).forEach(drawFish);draw('reef-front'+suf+'.png',-f.camera,124);
 let cor=assets['soft-coral'+suf+'.png'],cp=f.time/5.5%3;for(let j=0;j<2;j++){c.globalAlpha=j?cp%1:1-cp%1;let i=(Math.floor(cp)+j)%3;c.drawImage(cor,i*350,0,350,370,375-f.camera,569,350,370)}c.globalAlpha=1;
 fs.filter(v=>v.z>=.78).forEach(drawFish);effects(.48,1.01);for(let k=0;k<3;k++)draw('ray.png',150+k*590+Math.sin(f.time*.07+k)*24-f.camera*.25,-70,2,1.8,(65+18*Math.sin(f.time*.13+k))/255*day);
 if(day<1){c.fillStyle=`rgba(8,16,57,${(1-day)*150/255})`;c.fillRect(0,0,1920,1080)}if(warm||mode.value==='Dusk'){c.fillStyle=`rgba(241,105,108,${warm?38/255:20.9/255})`;c.fillRect(0,0,1920,1080)}}
 function tick(now){if(playing&&last)t=(t+Math.min(.1,(now-last)/1000))%59.99;last=now;slider.value=t;stamp.value=t.toFixed(1)+' s';render(frame(t));requestAnimationFrame(tick)}requestAnimationFrame(tick);
 slider.oninput=()=>{t=+slider.value;playing=false;play.textContent='Play'};play.onclick=()=>{playing=!playing;play.textContent=playing?'Pause':'Play'};document.querySelector('#full').onclick=()=>canvas.requestFullscreen();window.reefPreview={seek(v){t=v;playing=false;play.textContent='Play'},ready:true};
}catch(e){document.querySelector('#error').textContent=e.message+'. Serve the project with: python -m http.server 8000';console.error(e)}
</script></html>
